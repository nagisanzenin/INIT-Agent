[package]
name = "init-tui"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The owner's terminal client for INIT Agent (docs/tui.md)"

[[bin]]
name = "init-tui"
path = "src/main.rs"

# docs/tui.md §3.14: exact pins, vendored, offline. One dev-dependency (vt100, tests only).
[dependencies]
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "bracketed-paste"] }
unicode-width = "=0.2.2"
unicode-segmentation = "=1.13.3"
serde_json = "=1.0.154"   # Value only, no derive; never `preserve_order` (CONVENTIONS §5)
signal-hook = "=0.3.18"   # already in crossterm's tree: SIGINT in line mode, SIGTERM/SIGHUP restore
# already in crossterm's tree (its `std`, `stdio`, `termios` features): `event` adds a safe poll for the
# OSC 11 background query (render/palette.rs, term.rs), so the closure stays at 25 crates (docs/tui.md §3.14)
rustix = { version = "=1.1.5", default-features = false, features = ["std", "event"] }

# TUI-BRAND: the renderer's output is fed to a terminal emulator in property tests (tests are the only
# users; the binary's closure stays at 25 crates). vt100 adds vte and arrayvec to vendor/.
[dev-dependencies]
vt100 = "=0.18.1"
