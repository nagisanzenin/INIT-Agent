# Offline build against the single repo-root vendor/ (CONVENTIONS §2), like the other workspaces.
# Relative paths here resolve against the directory that holds .cargo/, i.e. this workspace.
# vendor/ is not committed; regenerate it with ci/vendor.sh (syncs every workspace).
[source.crates-io]
replace-with = "vendored-sources"
[source.vendored-sources]
directory = "../vendor"
[net]
offline = true
