[package]
name = "init-sandbox-profiles"
description = "Root-compiled sandbox profile texts, their composition and parameter checks, and the sandbox self-test (WP6a)"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The library is what `init-root` links (zone composition, V1-V5, `doctor --sandbox-selftest`).
# The binary is a stand-alone runner and the in-sandbox probe used by this crate's own tests.
[lib]
path = "src/lib.rs"

[[bin]]
name = "init-sbx-selftest"
path = "src/bin/init-sbx-selftest.rs"

[dependencies]
libc.workspace = true
serde_json.workspace = true
